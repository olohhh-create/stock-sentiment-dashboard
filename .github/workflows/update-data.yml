name: Daily Market Sentiment Data Update

on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run data fetcher script
        run: node scripts/fetch-data.js

      - name: Commit and push updated JSON data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/market-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update market sentiment data ($(date +'%Y-%m-%d'))" && git push)
