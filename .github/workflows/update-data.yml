name: Daily Market Sentiment Data Updateon:schedule:# 每天台灣時間 06:30 (UTC 22:30) 執行（美股收盤與台股盤後資料皆已更新完畢）- cron: '30 22 * * 1-5'允許在 GitHub 網頁介面上隨時手動點擊按鈕執行workflow_dispatch:permissions:contents: writejobs:update-market-data:runs-on: ubuntu-lateststeps:- name: Checkout repositoryuses: actions/checkout@v4  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  - name: Run data fetcher script
    run: node scripts/fetch-data.js

  - name: Commit and push updated JSON data
    run: |
      git config --local user.email "github-actions[bot]@users.noreply.github.com"
      git config --local user.name "github-actions[bot]"
      git add data/market-data.json
      git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update market sentiment data ($(date +'%Y-%m-%d'))" && git push)
